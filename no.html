<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1c1713">
    <title>Try Again</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ctext y=%2713%27 font-size=%2713%27 fill=%27%238a4c45%27%3E♥%3C/text%3E%3C/svg%3E">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./icons/icon-180.png">
    <!-- Saved to the Home Screen, the book opens full screen (iPhone Safari
         does not allow web pages to go full screen any other way). -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Forever">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css?v=64">
  </head>
  <body class="reader standalone">
    <main class="page" aria-labelledby="no-title">
      <div class="rule rule--small" aria-hidden="true"><span></span><b>❦</b><span></span></div>
      <h1 class="standalone-title" id="no-title">Oh… sare. <span class="emoji">🙈</span></h1>
      <p class="standalone-lead">Nee answer ki eppudu respect isthanu, Bangaram — adhi kuda naa promises lo okati.</p>
      <p>Kaani okka chinna doubt… button porapatuna press ayyindha? <span class="emoji">😄</span></p>
      <p>Time teesko. Nuvvu ready ayye varaku — chandamama tho paatu nenu kuda ikkade wait chesthanu.</p>
      <div class="rule rule--small" aria-hidden="true"><span></span><b>♥</b><span></span></div>
      <p><a class="standalone-link" id="back-to-question" href="./index.html#one-little-question">← Back to the question</a></p>
    </main>
    <script>
      // Swipe right or press → to go back to the question, as before.
      const questionUrl = "./index.html#one-little-question";
      let swipeStart = null;
      document.addEventListener("pointerdown", (event) => {
        if (!event.isPrimary || (event.pointerType === "mouse" && event.button !== 0)) return;
        swipeStart = { id: event.pointerId, x: event.clientX, y: event.clientY, type: event.pointerType };
      });
      document.addEventListener("pointerup", (event) => {
        if (!swipeStart || swipeStart.id !== event.pointerId) return;
        const start = swipeStart;
        swipeStart = null;
        if (window.getSelection()?.toString()) return;
        const dx = event.clientX - start.x;
        const dy = event.clientY - start.y;
        if (dx > (start.type === "mouse" ? 85 : 48) && dx > Math.abs(dy) * 1.35 && Math.abs(dy) < 110) window.location.assign(questionUrl);
      });
      document.addEventListener("pointercancel", () => { swipeStart = null; });
      document.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight" && !window.getSelection()?.toString()) window.location.assign(questionUrl);
      });
    </script>
  </body>
</html>
